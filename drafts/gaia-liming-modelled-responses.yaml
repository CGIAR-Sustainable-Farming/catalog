commodities:
  - beans
  - broad-beans
  - maize
  - soya-beans
  - wheat
citation:
  title: Unpacking the acid soil complex to explain crop yield responses to lime in East Africa.
  authors:
    - family: Silva
      given: João Vasco
    - family: Sida
      given: Tesfaye
    - family: Gameda
      given: Samuel
    - family: Desalegn
      given: Temesgn
    - family: Meliyo
      given: Joel
    - family: Mwango
      given: Sibaway
    - family: Ruganzu
      given: Vicky
    - family: Gebrekidan
      given: Bisrat
    - family: Jaleta
      given: Moti
    - family: Chamberlin
      given: Jordan
    - family: Baudron
      given: Frédéric
  url: https://www.acidsoils.africa/profitability
structures:
  - name: modelled-responses
    dimensions:
      - name: site
        type: location
        description: Source site name, without coordinates or an authoritative spatial identifier.
        data_type: string
        values:
          - Burera
          - Geita
          - Jimma
          - Mbozi
          - Misraq Gojjam
          - Ngororero
          - Nyaruguru
      - name: crop
        type: crop
        description: 'Source crop labels: bean, fababean (broad/faba bean), maize, soybean and wheat.'
        data_type: string
        values:
          - bean
          - fababean
          - maize
          - soybean
          - wheat
    variables:
      - name: lime_tha
        description: Lime application rate associated with the model estimate.
        data_type: number
        unit: t ha-1
      - name: emmean
        description: >-
          Estimated marginal mean absolute grain yield at the stated lime rate, site and crop; not
          the yield increment over zero lime.
        data_type: number
        unit: t ha-1
      - name: SE
        description: Standard error of the estimated marginal mean absolute grain yield.
        data_type: number
        unit: t ha-1
      - name: df
        description: Degrees of freedom associated with the model estimate.
        data_type: number
        unit: '1'
      - name: lower.CL
        description: >-
          Lower limit of the two-sided 95% Student-t confidence interval for mean absolute grain
          yield.
        data_type: number
        unit: t ha-1
        note: >-
          All 56 intervals numerically match emmean ± t(0.975,df)*SE to less than 1e-12. These are
          confidence intervals for means, not prediction intervals for individual fields.
      - name: upper.CL
        description: >-
          Upper limit of the two-sided 95% Student-t confidence interval for mean absolute grain
          yield.
        data_type: number
        unit: t ha-1
        note: >-
          All 56 intervals numerically match emmean ± t(0.975,df)*SE to less than 1e-12. These are
          confidence intervals for means, not prediction intervals for individual fields.
      - name: .group
        description: >-
          Compact-letter-display grouping symbols emitted by multcomp::cld for comparisons of
          estimated means; stored here as digit strings.
        data_type: string
        note: >-
          Treat as categorical symbols, not numeric measurements. Shared symbols indicate lack of a
          detected difference under the source test, not proof of equivalence. Exact multiplicity
          settings for the exported release remain unverified.
      - name: col
        description: >-
          Plotting colour/palette index retained from source analysis; not a measured soil or yield
          variable.
        data_type: integer
      - name: ecec
        description: >-
          Site-level model-estimated effective cation exchange capacity: exchangeable acidity plus
          exchangeable Ca, Mg, Na and K.
        data_type: number
        unit: cmol kg-1
        note: >-
          Centimoles of positive charge per kilogram (cmol(+)/kg in source labels). Trial soil
          processing selects 0–20 cm; soil attributes are site summaries, not individual plot
          measurements.
      - name: ExAc
        description: Site-level model-estimated exchangeable acidity.
        data_type: number
        unit: cmol kg-1
        note: >-
          Centimoles of positive charge per kilogram (cmol(+)/kg in source label); 0–20 cm
          trial-soil workflow. Extraction/analytical method remains unconfirmed.
      - name: pH
        description: Site-level model-estimated soil pH in water.
        data_type: number
        unit: '[pH]'
        note: >-
          Trial soil workflow selects 0–20 cm. Soil:water ratio and laboratory or prediction method
          remain unconfirmed.
      - name: SOC
        description: Site-level model-estimated soil organic carbon content.
        data_type: number
        unit: g kg-1
        note: >-
          Unit transcribed from source analysis-crop-vs-soil.R axis label, Soil organic C (g/kg).
          Original laboratory dictionary was not available to independently verify scaling; treat
          this unit as provisional. Trial soil workflow selects 0–20 cm.
      - name: tex
        description: >-
          Site-level model-estimated clay plus silt content, computed upstream as 100 minus sand
          percentage.
        data_type: number
        unit: '%'
        note: >-
          This is a continuous fine-fraction percentage, not a texture-class code. Trial soil
          workflow selects 0–20 cm.
data:
  - name: modelled-responses
    description: Source CSV with 56 rows and 15 columns; model estimates, uncertainty and soil covariates.
    structures:
      - modelled-responses
    locations:
      - url: https://www.acidsoils.africa/data/predicted_means_allcrops_soils.csv
    media_type: text/csv
    file_size: 11182
    checksum: sha256:9f62d163c8ac3aa35091a725e1231aa6527c61775f192942d27fb220b18d6acf
spatial:
  geography:
    - ethiopia
    - rwanda
    - united-republic-of-tanzania
