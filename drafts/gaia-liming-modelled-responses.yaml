# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.json
# REVIEW DRAFT: provisional roles and unresolved source facts are recorded in note.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
  - >-
    https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/agriculture/schema.json
id: gaia-liming-modelled-responses
version: '1'
title: East Africa modelled crop responses to lime
description: >-
  GAIA table containing 56 model-estimated crop response summaries across seven named sites and five
  crops, with lime treatment rates, uncertainty columns and soil attributes. These are modelled
  summaries, not raw plot observations.
license: CC-BY-4.0
resource_type: dataset
created: '2026-11-06'
updated: '2026-11-06'
access: public
keywords:
  - soil acidity
  - liming
  - soil health
contact:
  - organization: International Maize and Wheat Improvement Center (CIMMYT)
    roles:
      - producer
      - licensor
  - organization: SFP data hub catalogue team
    roles:
      - maintainer
  - organization: International Maize and Wheat Improvement Center (CIMMYT)
    name: João Vasco Silva
    email: j.silva@cgiar.org
    roles:
      - point-of-contact
note: >-
  REVIEW DRAFT. Provisional catalogue roles: CIMMYT as licensor and SFP data hub
  catalogue team as metadata maintainer. Licensor authority and the accountable organization/person
  behind the SFP team still require confirmation. Version 1 is a catalogue label for an unversioned
  source, not an asserted producer release. GAIA/CIMMYT supporting outputs linked through SFP PRMS;
  not claimed as newly produced SFP data. Absolute yield means and 95% confidence limits are
  identified from archived source tables and analysis code; the dashboard response plot subtracts
  the zero-lime mean. All 56 rows and 15 shared columns match the archived table within rounding
  after joining by site, crop and lime rate. Trial processing selects 0–20 cm soils; laboratory
  methods and exact input release remain unverified. Source citation is still in preparation with no
  verified year: citation.date remains omitted. Observation year is unresolved: an older related app
  says 2020, whereas a newer pipeline filters harvest_year=2022 and season=1; neither alone
  establishes the year of this exact summary export. Coordinates are absent; no bbox or temporal
  coverage inferred.
cdh:
  domain:
    - land
    - agricultural-production
  usage:
    intended_uses:
      - Research and regional assessment of soil acidity and liming responses.
    not_recommended_for:
      - use: Direct field-specific lime recommendations
        reason: >-
          Modelled estimates need local validation; spatial grids and trial summaries are not
          field-specific soil tests.
additional_links:
  - rel: about
    title: GAIA project and source contact
    url: https://www.acidsoils.africa/
  - rel: via
    title: Source agronomy dashboard, citation and download licence
    url: https://www.acidsoils.africa/profitability
  - rel: describedby
    title: Trial soil preparation and depth
    url: >-
      https://raw.githubusercontent.com/jvasco323/gaia-year1-analysis/674378f3a915ed5cc474c565c02c00001eedc77a/fred-scripts/1-data-wrangling.R
  - rel: describedby
    title: Soil units and variable labels
    url: >-
      https://raw.githubusercontent.com/jvasco323/gaia-year1-analysis/674378f3a915ed5cc474c565c02c00001eedc77a/analysis-crop-vs-soil.R
  - rel: describedby
    title: Site-level soil means and CSV export
    url: >-
      https://raw.githubusercontent.com/jvasco323/gaia-year1-analysis/674378f3a915ed5cc474c565c02c00001eedc77a/3-lmm-soil-models.R
  - rel: describedby
    title: Yield model estimates and grouping
    url: >-
      https://raw.githubusercontent.com/jvasco323/gaia-year1-analysis/674378f3a915ed5cc474c565c02c00001eedc77a/old-scripts/5-lmm-yield-models.R
  - rel: describedby
    title: Archived table matching all shared columns
    url: >-
