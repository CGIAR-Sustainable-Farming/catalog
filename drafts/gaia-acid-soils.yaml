# yaml-language-server: $schema=https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/schemas/profiles/cdh.schema.json
# REVIEW DRAFT: provisional roles and unresolved source facts are recorded in note.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json
id: gaia-acid-soils
version: '1'
title: GAIA acid soil management spatial products
description: >-
  Four downloaded GAIA spatial products for sub-Saharan Africa: soil pH in water, modelled lime
  requirement, crop yield loss associated with acidity, and first-year profitability. All-crop
  aggregates are supplied on their native grids for regional research and investment screening.
license: CC-BY-4.0
resource_type: dataset
created: '2026-11-06'
updated: '2026-11-06'
access: public
keywords:
  - soil acidity
  - liming
  - soil health
contact:
  - organization: International Maize and Wheat Improvement Center (CIMMYT)
    roles:
      - producer
      - licensor
  - organization: SFP data hub catalogue team
    roles:
      - maintainer
  - organization: International Maize and Wheat Improvement Center (CIMMYT)
    name: João Vasco Silva
    email: j.silva@cgiar.org
    roles:
      - point-of-contact
note: >-
  REVIEW DRAFT. Provisional catalogue roles: CIMMYT as licensor and SFP data hub
  catalogue team as metadata maintainer. Licensor authority and the accountable organization/person
  behind the SFP team still require confirmation. Version 1 is a catalogue label for an unversioned
  source, not an asserted producer release. GAIA/CIMMYT supporting outputs linked through SFP PRMS;
  not claimed as newly produced SFP data. Spatial input reference years differ: crop area and
  production use SPAM 2010 v2.0; crop prices are medians across sub-Saharan African countries during
  2016–2020. Neither interval is a soil sampling period or a common observation date for all assets.
  Soil observation dates remain unspecified. Dashboard methods and publication-linked code establish
  interpretation, but no published build manifest ties these exact downloaded bytes to a source-code
  commit. NaN denotes missing values; zero is valid. Ordinary GeoTIFFs, not COGs.
cdh:
  domain:
    - land
    - agricultural-production
  usage:
    intended_uses:
      - Research and regional assessment of soil acidity and liming responses.
    not_recommended_for:
      - use: Direct field-specific lime recommendations
        reason: >-
          Modelled estimates need local validation; spatial grids and trial summaries are not
          field-specific soil tests.
additional_links:
