  publisher: Nature Food 6, 799–808
  url: https://doi.org/10.1038/s43016-025-01194-z
spatial:
  bbox:
    - -17.525
    - -34.86666666666667
    - 51.475
    - 27.299999999999997
  crs: EPSG:4326
  geography:
    - sub-saharan-africa
structures:
  - name: soil_ph
    dimensions:
      - name: cell
        type: xy
        description: Regular 30 arc-second grid; approximately 1 km at the equator.
        step: 0.008333333333333333
        unit: degree
    variables:
      - name: soil_ph
        description: >-
          Soil pH in water for the top 0–30 cm of soil, calculated as a depth-weighted average of
          the 0–5, 5–15 and 15–30 cm source layers.
        data_type: float32
        nodata: NaN
        note: >-
          Depth weighting in publication-linked code is (5*pH_0_5 + 10*pH_5_15 + 15*pH_15_30)/30.
          Soil sampling/reference dates are not specified.
        unit: '[pH]'
  - name: lime_all
    dimensions:
      - name: cell
        type: xy
        description: Regular 5 arc-minute grid; approximately 9 km at the equator.
        step: 0.08333333333333333
        unit: degree
    variables:
      - name: lime_all
        description: >-
          Crop-area-weighted lime requirement, expressed as tonnes of CaCO3 per hectare, to reach
          crop-specific target acidity saturation.
        data_type: float32
        nodata: NaN
        note: >-
          Assumes 20 cm lime incorporation depth; this differs from the 0–30 cm averaging depth of
          pH and other soil inputs. LiTAS model uses crop-specific target acidity saturation, not
          one universal pH target. Dashboard methods specify harvested-area weighting across crops.
        unit: t ha-1
  - name: yloss_all
    dimensions:
      - name: cell
        type: xy
        description: Regular 5 arc-minute grid; approximately 9 km at the equator.
        step: 0.08333333333333333
        unit: degree
    variables:
      - name: yloss_all
        description: Crop-area-weighted percentage crop yield loss associated with soil acidity.
        data_type: float32
        nodata: NaN
        note: >-
          Dashboard methods specify crop-area weighting. Model code limits relative yield to 0.2–1,
          corresponding to a maximum modelled loss of 80%; this is a model constraint, not an
          empirical upper bound.
        unit: '%'
  - name: profit_all
    dimensions:
      - name: cell
        type: xy
        description: Regular 5 arc-minute grid; approximately 9 km at the equator.
        step: 0.08333333333333333
        unit: degree
    variables:
      - name: profit_all
        description: >-
          Crop-area-weighted first-year gross margin from liming: additional crop revenue minus lime
          cost, in US dollars per hectare.
        data_type: float32
        nodata: NaN
        note: >-
          Dashboard baseline: crop-specific median prices across sub-Saharan African countries for
          2016–2020 and fixed lime price 100 USD/t; publication-linked code uses baseline yield
          multiplier 1. This is incremental gross margin, not total farm profit. Inflation/base-year
          adjustment is not documented; do not label as constant-year dollars.
        unit: '{USD}/ha'
